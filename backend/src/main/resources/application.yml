spring:
  application:
    name: cineviet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cineviet}
    username: ${SPRING_DATASOURCE_USERNAME:cineviet}
    password: ${SPRING_DATASOURCE_PASSWORD:cineviet}
    hikari:
      maximum-pool-size: 20
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
cineviet:
  hold-duration: PT5M
  # Customer sessions are the default. Public registration and booking still need
  # operational security review before the backend is exposed to the Internet.
  customer-auth-enabled: true
  demo-enabled: false
